<!doctype html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>店舗マップ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="店舗マップ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('sm.theme') || 'auto'; } catch (e) { /* 既定のまま */ }</script>
<style>
:root, :root[data-theme="dark"] {
  --bg: #151618; --card: #1e1f22; --card-2: #26272b; --raised: #2d2e32; --input: #131416;
  --text: #d8dbe0; --muted: #9aa0a6; --faint: #6f757c; --border: #303236; --border-strong: #43464b;
  --blue: #8ab4f8; --accent: #3f72d8; --accent-hover: #5584e6; --on-accent: #f1f3f4; --on-tint: #33415c;
  --green: #81c995; --danger: #f28b82; --warn: #fdd663; --warn-bg: #4a3f1a; --bad-bg: #4a2523; --ok-bg: #1f3a29;
  --bar-bg: rgba(21,22,24,.92); --shadow: rgba(0,0,0,.5); --tile-filter: brightness(.72) contrast(1.1) saturate(.6);
  --map-bg: #0f1011; color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f7f9; --card: #ffffff; --card-2: #f1f3f4; --raised: #e8eaed; --input: #ffffff;
  --text: #202124; --muted: #5f6368; --faint: #80868b; --border: #dadce0; --border-strong: #c4c7cc;
  --blue: #1a73e8; --accent: #1a73e8; --accent-hover: #1765cc; --on-accent: #ffffff; --on-tint: #e8f0fe;
  --green: #188038; --danger: #d93025; --warn: #b06000; --warn-bg: #fef7e0; --bad-bg: #fce8e6; --ok-bg: #e6f4ea;
  --bar-bg: rgba(255,255,255,.94); --shadow: rgba(60,64,67,.25); --tile-filter: none; --map-bg: #e5e3df; color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg: #f6f7f9; --card: #ffffff; --card-2: #f1f3f4; --raised: #e8eaed; --input: #ffffff;
    --text: #202124; --muted: #5f6368; --faint: #80868b; --border: #dadce0; --border-strong: #c4c7cc;
    --blue: #1a73e8; --accent: #1a73e8; --accent-hover: #1765cc; --on-accent: #ffffff; --on-tint: #e8f0fe;
    --green: #188038; --danger: #d93025; --warn: #b06000; --warn-bg: #fef7e0; --bad-bg: #fce8e6; --ok-bg: #e6f4ea;
    --bar-bg: rgba(255,255,255,.94); --shadow: rgba(60,64,67,.25); --tile-filter: none; --map-bg: #e5e3df; color-scheme: light;
  }
}
:root { --rS: #ffd600; --rA: #f57c00; --rB: #689f38; --rC: #1e88e5; --rU: #8a8f96; --rX: #3a3b3f; --sheet-h: 50vh;
  --top: calc(46px + max(8px, env(safe-area-inset-top))); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none;
  touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
button, input, select, textarea { font: inherit; color: var(--text); }
button { background: var(--card-2); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 11px;
  cursor: pointer; transition: background .15s, transform .05s, border-color .15s; }
button:hover { background: var(--raised); border-color: var(--faint); }
button:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.primary:hover { background: var(--accent-hover); }
button.big { width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 10px; }
button.on { background: var(--on-tint); border-color: var(--blue); }
button:disabled { opacity: .5; cursor: default; }
button.icon { display: inline-flex; align-items: center; justify-content: center; width: 38px; padding: 0; }
button.icon svg { width: 20px; height: 20px; }
input, select, textarea { background: var(--input); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; font-size: 16px; }
select { padding-right: 4px; }
input:hover, select:hover, textarea:hover { border-color: var(--border-strong); }
textarea { width: 100%; min-height: 70px; resize: vertical; }
a { color: var(--blue); }
.hidden { display: none !important; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

header.top { position: fixed; z-index: 1000; top: 0; left: 0; right: 0; display: flex; gap: 6px; padding: 8px;
  padding-top: max(8px, env(safe-area-inset-top)); background: var(--bar-bg); border-bottom: 1px solid var(--border); }
header.top input { flex: 1; min-width: 0; }
header.top select { max-width: 126px; }
#map { position: fixed; top: var(--top); left: 0; right: 0; bottom: 0; background: var(--map-bg); }
.leaflet-container { background: var(--map-bg); font: inherit; }
.leaflet-tile-pane { filter: var(--tile-filter); }
.leaflet-control-attribution { background: var(--bar-bg) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--blue) !important; }
.leaflet-bar a { background: var(--card-2) !important; color: var(--text) !important; border-color: var(--border) !important; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--card); color: var(--text); }

.pin span { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid #f1f3f4; font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.55); }
.pin .rS { background: var(--rS); color: #222; width: 28px; height: 28px; font-size: 15px; }
.pin .rA { background: var(--rA); } .pin .rB { background: var(--rB); } .pin .rC { background: var(--rC); }
.pin .rU { background: var(--rU); } .pin .rX { background: var(--rX); border-color: #777; color: #ccc; }
.pin .closed { opacity: .45; }
.pin .sel { outline: 3px solid var(--blue); outline-offset: 2px; }
.pin .num { background: var(--accent); color: #fff; }
.pin-p span { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px;
  background: #5c6bc0; color: #fff; font-size: 11px; font-weight: 700; border: 1px solid #c5cae9; }
.pin-o span { display: block; width: 16px; height: 16px; border-radius: 50%; background: #4285f4; border: 3px solid #fff; box-shadow: 0 0 0 5px rgba(66,133,244,.3); }

.b { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; line-height: 21px; background: var(--raised); color: var(--text); white-space: nowrap; }
.b.rS { background: var(--rS); color: #222; font-weight: 700; } .b.rA { background: var(--rA); color: #fff; }
.b.rB { background: var(--rB); color: #fff; } .b.rC { background: var(--rC); color: #fff; }
.b.rU { background: var(--rU); color: #111; } .b.rX { background: var(--rX); color: #ddd; }
.b.warn { background: var(--warn-bg); color: var(--warn); } .b.bad { background: var(--bad-bg); color: var(--danger); }
.b.num { background: var(--accent); color: #fff; min-width: 24px; text-align: center; }
.sheet { position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--border-strong);
  border-radius: 14px 14px 0 0; box-shadow: 0 -6px 20px var(--shadow); padding-bottom: env(safe-area-inset-bottom); }
.grab { height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.grab::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--border-strong); transition: background .15s; }
.grab:hover::before { background: var(--faint); }
nav.tabs { display: flex; gap: 4px; padding: 0 8px 6px; }
nav.tabs button { flex: 1; padding: 8px 2px; font-size: 13px; }
.body { max-height: var(--sheet-h); overflow-y: auto; padding: 2px 12px 16px; }
.body, .vbox { scrollbar-color: auto; scrollbar-width: auto; }
.body::-webkit-scrollbar, .vbox::-webkit-scrollbar { width: 8px; }
.body::-webkit-scrollbar-thumb, .vbox::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
#card { z-index: 1002; }
#card .body { max-height: 64vh; }
.body { transition: max-height .26s cubic-bezier(.2,.8,.2,1); }
#card.tall .body { max-height: calc(100vh - var(--top) - 110px); }
#panel.tall .body { max-height: calc(100vh - var(--top) - 100px); }
.card-head { display: flex; gap: 8px; align-items: flex-start; padding: 0 12px 6px; }
.card-head h2 { font-size: 17px; margin: 2px 0 0; flex: 1; }
h3 { font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--card-2); border-radius: 8px; padding: 6px 8px; }
.stat .k { font-size: 11px; color: var(--muted); } .stat .v { font-size: 15px; font-weight: 600; }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 4px; }
.actions a, .actions button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; font-size: 12px;
  border-radius: 10px; text-decoration: none; background: var(--card-2); border: 1px solid var(--border-strong); color: var(--text); }
.actions a:hover, .actions button:hover { background: var(--raised); }
.actions .go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.actions .go:hover { background: var(--accent-hover); }
.actions svg { width: 20px; height: 20px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 8px; background: var(--card-2); cursor: pointer; transition: background .15s; }
.item:hover { background: var(--raised); }
.item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.vbox { max-height: 280px; overflow-y: auto; background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 6px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 1px 3px var(--shadow); }
.visit { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; white-space: pre-wrap; }
.visit .vh { display: flex; gap: 8px; color: var(--muted); font-size: 12px; }
.memo { background: var(--card-2); border-radius: 8px; padding: 7px 9px; white-space: pre-wrap; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: right; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t tr:hover td { background: var(--card-2); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chips button { padding: 5px 11px; border-radius: 16px; font-size: 13px; }
.seg { display: flex; gap: 0; }
.seg button { border-radius: 0; flex: 1; padding: 7px 4px; }
.seg button:first-child { border-radius: 8px 0 0 8px; } .seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button + button { border-left: none; }
.over { color: var(--danger); }
details { background: var(--card-2); border-radius: 10px; padding: 0 10px; margin-top: 12px; }
details summary { cursor: pointer; padding: 9px 0; color: var(--muted); font-weight: 600; font-size: 13px; }
details[open] { padding-bottom: 10px; }
.form { background: var(--card-2); border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px; margin-top: 8px; animation: up .15s ease-out; }
.form label { color: var(--muted); font-size: 12px; }
.ext svg { width: 12px; height: 12px; vertical-align: -1px; margin-left: 2px; }
.navlink { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; white-space: nowrap; }
.navlink:hover { background: var(--accent-hover); }
.vh-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.scroll-x { flex-wrap: nowrap; overflow-x: auto; padding: 4px 0 2px; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
.scroll-x button { flex: none; }
.group { display: flex; justify-content: space-between; width: 100%; margin: 6px 0 2px; font-weight: 600; font-size: 14px; color: var(--text);
  padding: 9px 12px; border-radius: 8px; background: var(--raised); }
.list-head { position: sticky; top: -2px; z-index: 2; background: var(--card); margin: 0 -12px 6px; padding: 2px 12px 8px;
  border-bottom: 1px solid var(--border); }
.b.rk { cursor: pointer; box-shadow: 0 0 0 1px transparent; transition: box-shadow .15s; }
.b.rk:hover { box-shadow: 0 0 0 2px var(--blue); }
.rk-pick { margin: -2px 0 4px 34px; animation: up .15s ease-out; }
.rk-pick button { padding: 6px 2px; font-size: 13px; }
.pin-new span { display: block; width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #ea4335;
  border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.picked { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; background: var(--card-2); }

#filters { position: fixed; z-index: 1003; top: var(--top); left: 8px; right: 8px; background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 12px; padding: 4px 12px 12px; box-shadow: 0 8px 24px var(--shadow); max-height: 70vh; overflow-y: auto; }
#mode { position: fixed; z-index: 1004; top: calc(var(--top) + 8px); left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--on-accent);
  padding: 7px 14px; border-radius: 16px; box-shadow: 0 4px 12px var(--shadow); cursor: pointer; white-space: nowrap; }
#toast { position: fixed; z-index: 2000; top: calc(var(--top) + 8px); right: 10px; max-width: 80vw; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#toast div { background: var(--raised); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 12px; animation: up .2s ease-out; box-shadow: 0 4px 12px var(--shadow); }
#toast div.err { border-color: var(--danger); color: var(--danger); }
body.busy { cursor: progress; }
#saving { position: fixed; z-index: 2001; top: calc(var(--top) + 8px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: 16px; background: var(--raised); border: 1px solid var(--border-strong); box-shadow: 0 4px 12px var(--shadow); white-space: nowrap; }
#saving i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--blue); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#pending { position: fixed; z-index: 2001; top: calc(var(--top) + 8px); left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 16px;
  background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); box-shadow: 0 4px 12px var(--shadow); white-space: nowrap; cursor: pointer; }
.pin-o.last span { background: #9aa0a6; box-shadow: 0 0 0 5px rgba(154,160,166,.3); }
#filters:not(.hidden) { animation: drop .2s ease-out; }
.search { position: relative; flex: 1; min-width: 0; display: flex; }
.search input { flex: 1; min-width: 0; padding-right: 30px; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
#qClear { position: absolute; right: 2px; top: 50%; margin-top: -15px; width: 30px; height: 30px; padding: 0; border: none; border-radius: 50%;
  background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
#qClear:hover { background: var(--raised); color: var(--text); }
#qClear svg { width: 18px; height: 18px; }
#setup { position: fixed; z-index: 1900; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
#setup .box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border-strong); border-radius: 14px; padding: 18px; }
#setup h2 { font-size: 17px; margin: 0 0 6px; }
#setup textarea { margin: 10px 0; min-height: 96px; font-size: 16px; }
button.danger { color: var(--danger); margin-left: 6px; }
button.danger.armed { background: var(--bad-bg); border-color: var(--danger); }
.vedit { margin-left: 2px; padding: 0 9px; font-size: 12px; line-height: 20px; border-radius: 10px; }
.body { overscroll-behavior: contain; }
@keyframes up { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 820px) {
  .sheet { left: auto; width: 430px; right: 12px; bottom: 12px; border-radius: 14px; border: 1px solid var(--border-strong); }
  :root { --sheet-h: 70vh; }
  #filters { left: auto; width: 430px; }
  header.top select { max-width: none; }
}
</style>
</head>
<body>
<header class="top">
  <select id="region" aria-label="地域"></select>
  <div class="search">
    <input id="q" type="search" placeholder="店名検索" aria-label="店名で検索">
    <button id="qClear" class="hidden" title="消す" aria-label="検索を消す"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm3.7 12.3-1.4 1.4L12 13.4l-2.3 2.3-1.4-1.4 2.3-2.3-2.3-2.3 1.4-1.4 2.3 2.3 2.3-2.3 1.4 1.4-2.3 2.3z"/></svg></button>
  </div>
  <button id="btnFilter" class="icon" title="絞り込み" aria-label="絞り込み"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>
  <button id="btnLocate" class="icon" title="現在地" aria-label="現在地"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button id="btnTheme" class="icon" title="表示の明るさ" aria-label="表示の明るさ"></button>
</header>
<div id="map"></div>
<div id="mode" class="hidden" title="タップでやめる"></div>

<div id="filters" class="hidden">
  <div class="grab" data-close="filters" aria-label="閉じる"></div>
  <h3 style="margin-top:4px">ランク</h3><div class="chips" id="fRanks"></div>
  <h3>ジャンル</h3><div class="chips" id="fGenres"></div>
  <h3>表示</h3>
  <div class="chips">
    <button data-f="showExcluded">☠ 行かない店</button>
    <button data-f="showClosed">閉店</button>
    <button data-f="showParking">駐車場</button>
    <button data-f="onlyStale">しばらく行ってない店だけ</button>
  </div>
  <div class="row" style="margin-top:12px"><span class="grow muted" id="fCount"></span><button id="fClose" class="primary">閉じる</button></div>
</div>

<section id="panel" class="sheet">
  <div class="grab" data-close="panel" aria-label="閉じる"></div>
  <nav class="tabs">
    <button data-tab="list">一覧</button>
    <button data-tab="route">ルート</button>
    <button data-tab="stats">分析</button>
    <button data-tab="check">チェック</button>
    <button data-tab="add">＋店舗</button>
  </nav>
  <div class="body hidden" id="tabBody"></div>
</section>

<section id="card" class="sheet hidden">
  <div class="grab" data-close="card" aria-label="閉じる"></div>
  <div class="card-head"><h2 id="cName"></h2><button id="cClose" class="icon" aria-label="閉じる" title="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="body" id="cBody"></div>
</section>

<div id="setup" class="hidden"><div class="box">
  <h2>店舗マップにつなぐ</h2>
  <div class="muted small">スプシのメニュー「接続コードを作る」で出たコードを貼ってください。最初の1回だけです。</div>
  <textarea id="sCode" aria-label="接続コード" placeholder="接続コード" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  <button id="sGo" class="primary big">つなぐ</button>
</div></div>

<div id="saving" class="hidden" role="status"><i></i><span id="waitText"></span></div>
<div id="pending" class="hidden" role="status"></div>
<div id="toast"></div>

<script>
'use strict';
const RANKS5 = ['S', 'A', 'B', 'C', '未評価'];
const RANK_POINT = { S: 5, A: 4, B: 3, C: 2, '未評価': 1, '-': 0 };

const api = (name, ...args) => call(name, args, false);
function call(name, args, quiet) {
  busy++; document.body.classList.add('busy');
  const wait = WAIT_TEXT[name];
  if (wait) showWait(1, wait);
  return new Promise((ok, ng) => {
    const done = () => { if (wait) showWait(-1); if (--busy === 0) document.body.classList.remove('busy'); };
    const fail = (e) => { done(); if (!quiet) toast((e && e.message) || String(e), true); ng(e); };
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler((r) => { done(); ok(r); }).withFailureHandler(fail)[name](...args);
    } else if (window.MOCK) {
      window.MOCK[name](...args).then((r) => { done(); ok(r); }, fail);
    } else {
      viaHttp(name, args).then((r) => { done(); ok(r); }, fail);
    }
  });
}
const netError = (msg) => Object.assign(new Error(msg), { net: true });
async function viaHttp(name, args) {
  const c = store('conn');

    r = await fetch(c.url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: c.key, fn: name, args }) });
  } catch (e) { throw netError('通信できませんでした。電波を確認して、もう一度試してください'); }
  let j;
  try { j = await r.json(); } catch (e) { throw netError('通信が不安定です。少し待って、もう一度試してください'); }
  if (!j.ok) {
    if (j.e === '接続コードが違います') store('conn', null);
    throw new Error(j.e);
  }
  return j.r;
}
function parseCode(text) {

    const [url, key] = atob(text.trim().replace(/-/g, '+').replace(/_/g, '/')).split('|');
    const okUrl = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)
      || (location.hostname === '127.0.0.1' && /^http:\/\/127\.0\.0\.1:\d+\//.test(url));
    return okUrl && key ? { url, key } : null;
  } catch (e) { return null; }
}

function km(a, b) {
  const x = (b.lng - a.lng) * 111 * Math.cos(((a.lat + b.lat) / 2) * Math.PI / 180);
  const y = (b.lat - a.lat) * 111;
  return Math.sqrt(x * x + y * y);
}

const rankOf = (s) => (s['状態'] === '除外' ? '-' : s['ランク'] || '未評価');
const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
const hm = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const navUrl = (p) => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + p.lat + ',' + p.lng;

const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseDay = (s) => new Date(String(s || '').slice(0, 10).replace(/\//g, '-') + 'T00:00:00');
const validDay = (s) => !isNaN(parseDay(s).getTime());
const md = (s) => { const d = parseDay(s); return isNaN(d.getTime()) ? String(s) : (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); };

const T_FROM = 8 * 60, T_TO = 22 * 60;
function timeOptions(sel, blank) {

}

async function refreshData() {

  const quiet = !!S.data;
  WAIT_TEXT.getData = quiet ? '最新に更新中…' : '読み込み中…';
  try {
    const d = await call('getData', [], quiet);
    store('cache', d);
    S.loadedAt = Date.now(); S.stale = false;
    if (quiet) applyFresh(d); else load(d);
  } catch (e) {

const FIXED_REGIONS = ['埼玉', '茨城', '群馬・栃木', '千葉', '東京・神奈川'];

function fillRegions() {

  S.data.regions = FIXED_REGIONS.concat(rest.sort((a, b) => prefRank(a) - prefRank(b)));
  $('#region').innerHTML = S.data.regions.concat(['全国']).map((r) => `<option>${esc(r)}</option>`).join('');

function inRegion(s) { return S.region === '全国' || areaOf(s) === S.region; }
function visible(s) {
  if (!inRegion(s)) return false;
  const st = s['状態'];
  if (st === '閉店') return S.f.showClosed;
  if (st === '除外') { if (!S.f.showExcluded) return false; }
  else if (!S.f.ranks.has(s['ランク'] || '未評価')) return false;
  if (S.f.genres && !S.f.genres.has(s['ジャンル'])) return false;
  if (S.f.onlyStale && s['鮮度'] !== '要再訪確認') return false;
  if (S.q && String(s['店名']).indexOf(S.q) < 0) return false;

}
function score(s) { return RANK_POINT[rankOf(s)] * 100000 + (Number(s['時給換算']) || Number(s['平均見込み利益']) || 0); }

function pinIcon(s) {
  const r = rankOf(s);
  const routeIdx = S.route.result ? S.route.result.order.indexOf(s['店舗ID']) : -1;
  let glyph = s['状態'] === '除外' ? '☠' : r === 'S' ? '★' : (GENRE_MARK[s['ジャンル']] || '・');
  let cls = RANK_CLASS[r];
  if (s['状態'] === '閉店') { glyph = '×'; cls += ' closed'; }
  if (routeIdx >= 0) { glyph = routeIdx + 1; cls += ' num'; }
  if (S.open === s['店舗ID']) cls += ' sel';
  return L.divIcon({ className: 'pin', html: `<span class="${cls}">${glyph}</span>`, iconSize: r === 'S' ? [28, 28] : [24, 24] });

  shown.forEach((s) => {
    const m = L.marker(pos(s), { icon: pinIcon(s), title: s['店名'], zIndexOffset: RANK_POINT[rankOf(s)] * 100 });
    m.on('click', (e) => { L.DomEvent.stopPropagation(e); openCard(s['店舗ID']); });

async function makeRoute() {
  const R = S.route;
  if (!S.origin) { const o = await locate(false); if (!o) return; }
  R.fixedStart = null;
  const t = routeTimes();
  if (R.start === 'now') R.fixedStart = t.start;
  const move = Number(S.data.settings['移動の目安(分)']) || 15;
  const cap = Math.max(1, Math.min(23, Math.floor((t.end - t.start) / (R.stay + move))));
  const cutoff = R.skipDays > 0 ? addDays(S.data.today, -R.skipDays) : null;
  let cand = S.data.stores.filter((s) => visible(s) && s['状態'] === '営業中' && RANK_POINT[rankOf(s)] >= RANK_POINT[R.minRank]
    && !(cutoff && s['最終訪問日'] && s['最終訪問日'] >= cutoff));
  if (R.limit > 0) {
    cand = cand.filter((s) => km(S.origin, pos(s)) <= R.limit * 0.9).sort((a, b) => score(b) - score(a)).slice(0, 40);
    if (!cand.length) return toast('条件に合う店が近くにありません。範囲かランクを広げてください', true);
    const mins = await api('driveMinutes', S.origin, cand.map((s) => ({ id: s['店舗ID'], lat: pos(s).lat, lng: pos(s).lng })));
    cand = cand.filter((s) => mins[s['店舗ID']] != null && mins[s['店舗ID']] <= R.limit);
  } else {
    cand = cand.sort((a, b) => km(S.origin, pos(a)) - km(S.origin, pos(b))).slice(0, cap * 3);
  }
  if (!cand.length) return toast('条件に合う店がありません。範囲かランクを広げてください', true);
  cand.sort((a, b) => score(b) - score(a));
  R.ids = cand.slice(0, cap).map((s) => s['店舗ID']);
  await calcRoute();
  let trimmed = 0;
  while (R.result && finishTime() > t.end && R.ids.length > 1 && trimmed < 4) {
    const worst = R.ids.slice().sort((a, b) => score(S.byId[a]) - score(S.byId[b]))[0];
    R.ids = R.ids.filter((id) => id !== worst);
    trimmed++;
    await calcRoute();
  }
  toast(`${R.ids.length}店のルートを作りました${trimmed ? '(時間に合わせて' + trimmed + '店外しました)' : ''}`);
  render(false);
  if (R.result) fitTo([S.origin].concat(R.ids.map((id) => pos(S.byId[id]))));
}

function finishTime() {
  const R = S.route, res = R.result;
  let t = routeTimes().start;
  res.order.forEach((id, i) => { t += res.legs[i].min + R.stay; });
  if (R.back && res.legs[res.order.length]) t += res.legs[res.order.length].min;
  return t;
}

async function calcRoute() {
  const R = S.route;
  if (!S.origin || !R.ids.length) { R.result = null; routeLayer.clearLayers(); return; }
  const stops = R.ids.map((id) => ({ id, lat: pos(S.byId[id]).lat, lng: pos(S.byId[id]).lng }));
  R.result = await api('planRoute', S.origin, stops, R.back);
  routeLayer.clearLayers();
  if (R.result.polyline) L.polyline(decodePolyline(R.result.polyline), { color: '#4285f4', weight: 5, opacity: .85 }).addTo(routeLayer);
  render(false);
}

function decodePolyline(str) {
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length) {
    for (const k of [0, 1]) {
      let b, shift = 0, result = 0;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}

async function fetchJson(url, opts, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, Object.assign({ signal: ctl.signal }, opts));
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } finally { clearTimeout(t); }
}
async function namesFromBrowser(lat, lng) {
  if (window.MOCK) return null;  // ローカルの画面確認では外へ出ない
  const m = (a) => Math.round(km({ lat, lng }, a) * 1000);
  try {
    const q = `[out:json][timeout:10];nwr(around:150,${lat},${lng})["name"]["shop"];out center tags 40;`;
    const d = await fetchJson('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }, 9000);
    const seen = {};
    return (d.elements || []).map((e) => {
      const t = e.tags || {};
      let name = t['name:ja'] || t.name || '';
      if (t.branch && name.indexOf(t.branch) < 0) name += ' ' + t.branch;
      const c = e.center || { lat: e.lat, lon: e.lon };
      return { name, genre: SHOP_GENRE[t.shop] || 'その他', m: m({ lat: c.lat, lng: c.lon }) };
    }).filter((x) => x.name && !seen[x.name] && (seen[x.name] = true)).sort((a, b) => a.m - b.m).slice(0, 8);
  } catch (e) {
    const n = await fetchJson(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=ja&lat=${lat}&lon=${lng}`, {}, 8000);
    return n && n.name ? [{ name: n.name, genre: SHOP_GENRE[n.type] || 'その他', m: m({ lat: Number(n.lat), lng: Number(n.lon) }) }] : [];
  }
}

  if (!box || !S.sug) return;
  if (S.sug.list === null) { box.innerHTML = '<span class="faint small">近くの店名を探しています…</span>'; return; }
  if (!S.sug.list.length) { box.innerHTML = `<span class="faint small">${S.sug.err ? '店名の候補を取れませんでした' : '近くに店名の候補がありません'}。手で入れてください</span>`; return; }
  box.innerHTML = '<span class="faint small" style="width:100%">近くの店(OpenStreetMapより。タップで入る)</span>'
    + S.sug.list.map((x, i) => `<button data-s="${i}">${esc(x.name)} <span class="faint">${x.m}m</span></button>`).join('');
  box.querySelectorAll('[data-s]').forEach((b) => {
    b.onclick = () => {
      const x = S.sug.list[b.dataset.s];
      $('#aName').value = x.name;
      const g = $('#aGenre');
      if ([...g.options].some((o) => o.value === x.genre)) g.value = x.genre;
      box.querySelectorAll('[data-s]').forEach((y) => y.classList.toggle('on', y === b));
    };
  });
}
function clearPin() {
  if (S.newPin) S.newPin.remove();
  S.newPin = null; S.addPos = null;
}
const posText = () => (S.addPos ? '赤いピンの位置で登録します(ピンはドラッグで動かせる)' : '');

function tabAdd(el) {
  const p = S.addPos;
  const genres = genreList();
  if (!p) {
    el.innerHTML = `<h3 style="margin-top:6px">新しい店を追加</h3>
      <div class="memo">地図の、店の場所を<b>長押し</b>するとピンが刺さって、ここに登録画面が出ます(PCは右クリック)。</div>
      <div class="chips" style="margin-top:8px"><button id="aHere">今いる所に刺す</button></div>`;
    $('#aHere').onclick = async () => { try { const o = await getLocation(); dropPin(o); focusOn(o, 17); } catch (e) { toast(e.message, true); } };
    return;
  }
  el.innerHTML = `<h3 style="margin-top:6px">新しい店を追加</h3>
    <div class="muted small" id="aPos">${posText()}</div>
    <h3>店の情報</h3>
    <input id="aName" style="width:100%" placeholder="店名">
    <div class="chips" id="aSug" style="margin-top:6px"></div>
    <div class="row" style="margin-top:6px">
      <select id="aGenre" class="grow">${genres.map((g) => `<option>${esc(g)}</option>`).join('')}</select>
      <select id="aRank" class="grow">${['未評価', 'C', 'B', 'A', 'S'].map((r) => `<option>${r === 'S' ? '★S' : r}</option>`).join('')}</select>
    </div>
    <textarea id="aMemo" placeholder="基本メモ(駐車場・売り場の特徴など)" style="margin-top:6px"></textarea>
    <div class="faint small" style="margin-top:4px">県・市区町村は位置から自動で入る</div>
    <div class="row" style="margin-top:8px"><button id="aCancel">やめる(ピンを消す)</button><span class="grow"></span><button id="aSave" class="primary">追加する</button></div>`;
  renderSug();
  $('#aCancel').onclick = () => { clearPin(); tabAdd(el); };
  $('#aSave').onclick = async () => {
    const name = $('#aName').value.trim(); if (!name) return toast('店名を入れてください', true);
    $('#aSave').disabled = true;
    let s;
    try {
      s = await api('addStore', { name, genre: $('#aGenre').value, rank: $('#aRank').value.replace('★', ''), memo: $('#aMemo').value.trim(), lat: S.addPos.lat, lng: S.addPos.lng });
    } catch (e) { $('#aSave').disabled = false; return; }
    clearPin();
    if (areaOf(s) !== S.region && S.region !== '全国') { S.region = areaOf(s); store('region', S.region); }
    replaceStore(withStats(s));
    toast(`「${s['店名']}」を追加しました(${s['県']})`); openCard(s['店舗ID']);
  };
}

init();
</script>
</body>
</html>
